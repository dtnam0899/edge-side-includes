name: portal

on:
  pull_request:
    paths:
      - "web/esi-portal/**"
      - ".github/workflows/portal.yml"
  push:
    branches: [main]
    paths:
      - "web/esi-portal/**"
      - ".github/workflows/portal.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/esi-portal
    steps:
      - uses: actions/checkout@v7
      # Lint, the feature-boundary test, unit tests and the production build run in the `check` stage.
      - name: Check
        run: docker build --target check -t portal:check .
      - name: Build runtime image
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t portal:ci .
      - name: Runtime config and health
        run: |
          docker run -d --name portal -p 8080:8080 -e ESI_PORTAL_API_BASE_URL=https://api.example.test portal:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/config.json | grep -q '"apiBaseUrl": "https://api.example.test"'
          curl -fsS http://127.0.0.1:8080/assistant | grep -q '<app-shell>' || { docker logs portal; exit 1; }
