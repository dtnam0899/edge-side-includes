name: lib

on:
  pull_request:
    paths:
      - "lib/**"
      - ".github/workflows/lib.yml"
  push:
    branches: [develop, main]
    paths:
      - "lib/**"
      - ".github/workflows/lib.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@v7
      # Builds, tests and lints every package and checks the module boundaries, all inside the Docker build.
      - name: Build and check
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t lib:ci .
