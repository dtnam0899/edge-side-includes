# SPA server for the portal (nginx-unprivileged listens on 8080 as a non-root user).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Runtime config is written at container start; never cache it.
  location = /config.json {
    add_header Cache-Control "no-store";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Hashed bundles can be cached for a long time.
  location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
