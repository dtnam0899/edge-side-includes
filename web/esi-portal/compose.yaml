# Local run of the built portal. The API is not part of this project; point ESI_PORTAL_API_BASE_URL at a running core-backend.
services:
  portal:
    build:
      context: .
      target: runtime
      secrets:
        - npm_token
    image: esi-portal:dev
    ports:
      - "4200:8080"
    environment:
      ESI_PORTAL_API_BASE_URL: ${ESI_PORTAL_API_BASE_URL:-/api}

# Token for @dtnam0899/* packages during the image build (export NODE_AUTH_TOKEN=$(gh auth token)).
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
