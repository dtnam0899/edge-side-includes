<a class="skip-link" href="#main">Skip to content</a>
<header class="shell-header">
  <span class="shell-brand">ESI Portal</span>
  <nav aria-label="Primary">
    <ul>
      @for (item of navItems; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>
  @if (session.user(); as user) {
    <div class="shell-account">
      <span class="shell-user"><span class="visually-hidden">Signed in as </span>{{ user.displayName }}</span>
      <button pButton type="button" size="small" severity="secondary" [outlined]="true" (click)="session.signOut()">
        Sign out
      </button>
    </div>
  }
</header>
<main id="main" class="shell-main" tabindex="-1">
  <router-outlet />
</main>
