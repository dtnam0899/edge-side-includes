openapi: 3.0.3
info:
  title: ESI core API
  version: 0.1.0
  description: |
    HTTP API of services/core-backend, used by the assistant module of web/esi-portal (UR-1, SR-1..SR-9).

    **Authentication.** No identity provider exists yet. Local testing assumes a single local user with the admin
    role, so this version declares no security scheme. Every operation still acts only on the current user's own
    resources; another user's resource answers 404. A real scheme is added with the authentication ADR before the
    production release.

    **Secrets.** No response contains a connection string, password or key. Connection strings are write-only.

    **Consent.** A user must accept the current consent terms before adding a connection. Withdrawing consent
    for a connection disables everything tied to it (schema, chat, execution, scripts, artifacts, dashboards):
    those operations answer 403 `consent-withdrawn`, and lists omit its items. Granting consent again restores
    access; nothing is deleted.

    **Problems** (`application/problem+json`, type `urn:esi:problem:<name>`):
    `consent-required` (403, terms not accepted or outdated), `consent-withdrawn` (403),
    `terms-version-outdated` (409), `connection-failed` (422, non-secret reason), `sql-rejected` (422, the
    statement is not a single read-only SELECT; `issues` explains why), `execution-failed` (422, SQL Server
    error), `execution-timeout` (504), `invalid-result-columns` (422, empty or duplicate column names),
    `dsl-validation-failed` (422, the generated DSL stayed invalid after the retries; `issues` lists the
    findings), `visualization-not-supported` (422, for example a chart or a form), `artifact-unavailable`
    (409, its connection was deleted or its consent withdrawn), `not-found` (404).
tags:
  - name: Consent
    description: "Consent terms, the user's acceptance, and per-connection consent (grant and withdraw)."
  - name: Connections
    description: "The current user's SQL Server connections. Connection strings are write-only."
  - name: Schema
    description: "Schema metadata of a connected database."
  - name: Chat
    description: "Chat sessions per connection: questions, generated SQL, and visualizations."
  - name: Executions
    description: "Running an approved SELECT, one page at a time."
  - name: Scripts
    description: "Generated stored-procedure scripts saved to the user's library."
  - name: Artifacts
    description: "Saved DSL artifacts bound to a SELECT."
  - name: Dashboards
    description: "Personal dashboards of saved artifacts with item layout."
paths:
  /consent/terms:
    get:
      tags: [Consent]
      operationId: getConsentTerms
      summary: Get the current consent terms.
      description: Get the current consent terms.
      responses:
        '200':
          description: Current terms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentTerms'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /consent/acceptance:
    get:
      tags: [Consent]
      operationId: getConsentAcceptance
      summary: Get the current user's latest acceptance of the consent terms.
      description: Get the current user's latest acceptance of the consent terms.
      responses:
        '200':
          description: Latest acceptance; `isCurrent` is false when the terms changed since.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentAcceptance'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Consent]
      operationId: acceptConsentTerms
      summary: Accept a version of the consent terms.
      description: Records user, terms version and time. Only the current version can be accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptConsentRequest'
      responses:
        '201':
          description: Acceptance recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentAcceptance'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /connections:
    get:
      tags: [Connections]
      operationId: listConnections
      summary: List the current user's connections, including those with withdrawn consent.
      description: List the current user's connections, including those with withdrawn consent.
      responses:
        '200':
          description: Connections, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Connections]
      operationId: createConnection
      summary: Add a SQL Server connection.
      description: Requires an accepted, current version of the consent terms (403 `consent-required` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
      responses:
        '201':
          description: Connection created; the connection string is stored encrypted and never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /connections/{connectionId}:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      tags: [Connections]
      operationId: getConnection
      summary: Get one of the current user's connections.
      description: Get one of the current user's connections.
      responses:
        '200':
          description: Connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Connections]
      operationId: updateConnection
      summary: Rename a connection or replace its connection string.
      description: Rename a connection or replace its connection string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionRequest'
      responses:
        '200':
          description: Updated connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Connections]
      operationId: deleteConnection
      summary: Delete a connection.
      description: Its artifacts and dashboards remain and report `unavailable`.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /connections/{connectionId}/test:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [Connections]
      operationId: testConnection
      summary: Try to open the connection.
      description: Try to open the connection.
      responses:
        '200':
          description: The connection opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          description: The connection failed (`connection-failed`); `detail` is a non-secret reason.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /connections/{connectionId}/consent:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    put:
      tags: [Consent]
      operationId: grantConnectionConsent
      summary: Grant (or grant again) consent for this connection.
      description: Requires an accepted, current version of the consent terms. Restores hidden data.
      responses:
        '200':
          description: Consent granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Consent]
      operationId: withdrawConnectionConsent
      summary: Withdraw consent for this connection.
      description: Disables every feature for the connection and hides its data without deleting it.
      responses:
        '204':
          description: Consent withdrawn.
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /connections/{connectionId}/schema:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      tags: [Schema]
      operationId: getConnectionSchema
      summary: Read the schema metadata of the connected database.
      description: Read the schema metadata of the connected database.
      responses:
        '200':
          description: Schemas, tables/views, columns, keys and stored procedure definitions; no row values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaMetadata'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /connections/{connectionId}/chat-sessions:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      tags: [Chat]
      operationId: listChatSessions
      summary: List the current user's chat sessions for this connection.
      description: List the current user's chat sessions for this connection.
      responses:
        '200':
          description: Sessions, most recently active first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSessionSummary'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Chat]
      operationId: createChatSession
      summary: Start a chat session for this connection.
      description: Start a chat session for this connection.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionRequest'
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /chat-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chat]
      operationId: getChatSession
      summary: Reopen a chat session with its messages.
      description: Reopen a chat session with its messages.
      responses:
        '200':
          description: Session and messages, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /chat-sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chat]
      operationId: sendChatMessage
      summary: Ask a question; the assistant answers with generated SQL (never executed here).
      description: >-
        Synchronous: the response holds the complete assistant answer. Generation alone never executes SQL or
        changes the database. A stored-procedure script is saved to the user's script library automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '201':
          description: The user's message and the assistant's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatTurn'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /chat-sessions/{sessionId}/visualizations:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Chat]
      operationId: createVisualization
      summary: Turn result columns and a visualization intent into a validated DSL document.
      description: >-
        Core sends only the column definitions (never rows) to the agent, validates the returned DSL and retries
        at most 2 times (configurable) with the validation findings. The returned document is valid; an invalid
        document is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisualizationRequest'
      responses:
        '200':
          description: Validated DSL document bound to the given columns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visualization'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          description: >-
            `dsl-validation-failed` (with `issues`) after the retries, or `visualization-not-supported` (for
            example a chart or a form).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /connections/{connectionId}/executions:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [Executions]
      operationId: executeQuery
      summary: Run an approved SELECT and return one page of its result.
      description: >-
        Only on an explicit user action. The statement must be a single read-only SELECT (ADR-0004); anything else
        is rejected before it reaches the database. Each page re-runs the statement with the configured command
        timeout (default 30 s). Cells larger than 64 KB are truncated and listed in `truncatedCells`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteQueryRequest'
      responses:
        '200':
          description: One page of the result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          description: '`sql-rejected` (with `issues`), `execution-failed` or `invalid-result-columns`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: '`execution-timeout`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /connections/{connectionId}/scripts:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      tags: [Scripts]
      operationId: listScripts
      summary: List stored-procedure scripts saved for this connection.
      description: List stored-procedure scripts saved for this connection.
      responses:
        '200':
          description: Scripts, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Script'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /scripts/{scriptId}:
    parameters:
      - $ref: '#/components/parameters/ScriptId'
    get:
      tags: [Scripts]
      operationId: getScript
      summary: Get a saved script.
      description: Get a saved script.
      responses:
        '200':
          description: Script.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Script'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Scripts]
      operationId: deleteScript
      summary: Delete a saved script.
      description: Delete a saved script.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /connections/{connectionId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      summary: List saved DSL artifacts for this connection.
      description: List saved DSL artifacts for this connection.
      responses:
        '200':
          description: Artifacts, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactSummary'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Artifacts]
      operationId: createArtifact
      summary: Save a DSL artifact with the SELECT it is bound to.
      description: >-
        Core validates the SELECT (ADR-0004) and the DSL (ADR-0002) before saving; the DSL must bind only to the
        given columns. No row data and no connection secret is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArtifactRequest'
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          description: '`sql-rejected` or `dsl-validation-failed`, with `issues`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Artifacts]
      operationId: getArtifact
      summary: Get a saved artifact with its DSL and SELECT.
      description: Get a saved artifact with its DSL and SELECT.
      responses:
        '200':
          description: Artifact; `status` tells whether its connection is usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Artifacts]
      operationId: deleteArtifact
      summary: Delete a saved artifact; dashboard items that used it report it as missing.
      description: Delete a saved artifact; dashboard items that used it report it as missing.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /artifacts/{artifactId}/executions:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [Artifacts]
      operationId: executeArtifact
      summary: Run the artifact's saved SELECT on live data and return one page.
      description: Same policy as `executeQuery`. Used for previews and for each dashboard item.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteArtifactRequest'
      responses:
        '200':
          description: One page of the result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          description: '`artifact-unavailable`: its connection was deleted or its consent withdrawn.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '504':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /connections/{connectionId}/dashboards:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      tags: [Dashboards]
      operationId: listDashboards
      summary: List the current user's dashboards for this connection.
      description: List the current user's dashboards for this connection.
      responses:
        '200':
          description: Dashboards, most recently changed first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardSummary'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Dashboards]
      operationId: createDashboard
      summary: Create an empty dashboard.
      description: Create an empty dashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardNameRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /dashboards/{dashboardId}:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    get:
      tags: [Dashboards]
      operationId: getDashboard
      summary: Open a dashboard with its items, layout and artifacts.
      description: >-
        Items carry their artifact (DSL and SELECT) or, when it is missing or unavailable, a status. Data is not
        included; the client runs `executeArtifact` per item, so one failing item does not block the others.
      responses:
        '200':
          description: Dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Dashboards]
      operationId: renameDashboard
      summary: Rename a dashboard.
      description: Rename a dashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardNameRequest'
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Dashboards]
      operationId: deleteDashboard
      summary: Delete a dashboard (its artifacts stay).
      description: Delete a dashboard (its artifacts stay).
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /dashboards/{dashboardId}/items:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    post:
      tags: [Dashboards]
      operationId: addDashboardItem
      summary: Add a saved artifact of the same connection to the dashboard.
      description: Add a saved artifact of the same connection to the dashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDashboardItemRequest'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardItem'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /dashboards/{dashboardId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
      - $ref: '#/components/parameters/ItemId'
    delete:
      tags: [Dashboards]
      operationId: removeDashboardItem
      summary: Remove an item from the dashboard (the artifact stays).
      description: Remove an item from the dashboard (the artifact stays).
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /dashboards/{dashboardId}/layout:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    put:
      tags: [Dashboards]
      operationId: saveDashboardLayout
      summary: Save the position and size of every item after drag or resize.
      description: Layout is stored with the dashboard, never inside the DSL. Every current item must be listed once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDashboardLayoutRequest'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
components:
  parameters:
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ScriptId:
      name: scriptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DashboardId:
      name: dashboardId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  schemas:
    Problem:
      $ref: '../common/components.yaml#/components/schemas/Problem'
    FieldError:
      $ref: '../common/components.yaml#/components/schemas/FieldError'
    ValidationIssue:
      $ref: '../common/components.yaml#/components/schemas/ValidationIssue'
    PageInfo:
      $ref: '../common/components.yaml#/components/schemas/PageInfo'
    ColumnDefinition:
      $ref: '../common/components.yaml#/components/schemas/ColumnDefinition'
    SchemaMetadata:
      $ref: '../common/components.yaml#/components/schemas/SchemaMetadata'
    SqlOutputKind:
      $ref: '../common/components.yaml#/components/schemas/SqlOutputKind'
    VisualizationIntent:
      $ref: '../common/components.yaml#/components/schemas/VisualizationIntent'
    DslDocument:
      $ref: '../common/components.yaml#/components/schemas/DslDocument'
    Id:
      type: string
      format: uuid
      example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
    ConsentTerms:
      type: object
      required: [version, text, status, publishedAt]
      properties:
        version:
          type: string
          example: '2026-10-18.1'
        text:
          type: string
          description: Terms in Markdown.
        status:
          type: string
          description: '`draft` until an administrator approves the text for production.'
          enum: [draft, approved]
        publishedAt:
          type: string
          format: date-time
    AcceptConsentRequest:
      type: object
      required: [termsVersion]
      properties:
        termsVersion:
          type: string
          example: '2026-10-18.1'
    ConsentAcceptance:
      type: object
      required: [termsVersion, acceptedAt, isCurrent]
      properties:
        termsVersion:
          type: string
        acceptedAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
          description: False when newer terms exist; the user must accept again before connections are used.
    Connection:
      type: object
      description: A SQL Server connection owned by the current user. Never contains the connection string.
      required: [id, name, server, database, consent, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: Sales DB
        server:
          type: string
          description: Host (and instance or port) taken from the connection string, without credentials.
          example: sql01.example.local
        database:
          type: string
          example: Sales
        consent:
          type: string
          description: '`granted` or `withdrawn` for this connection.'
          enum: [granted, withdrawn]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateConnectionRequest:
      type: object
      required: [name, connectionString]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        connectionString:
          type: string
          writeOnly: true
          description: SQL Server connection string. Stored encrypted (ADR-0003); never returned or logged.
          example: Server=sql01.example.local;Database=Sales;User Id=reader;Password=***;Encrypt=True
    UpdateConnectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        connectionString:
          type: string
          writeOnly: true
          description: Omit to keep the stored connection string.
    ConnectionTestResult:
      type: object
      required: [serverVersion, durationMs]
      properties:
        serverVersion:
          type: string
          example: 17.0.1000.7
        durationMs:
          type: integer
          minimum: 0
    ChatSessionSummary:
      type: object
      required: [id, connectionId, title, createdAt, lastActivityAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        connectionId:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
    ChatSession:
      allOf:
        - $ref: '#/components/schemas/ChatSessionSummary'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessage'
    CreateChatSessionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          description: Defaults to the first question.
    SendChatMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          example: Total revenue per customer in 2026
    ChatMessage:
      type: object
      required: [id, role, text, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
          description: The question, or the assistant's explanation (assumptions, tables and joins used).
        createdAt:
          type: string
          format: date-time
        generatedSql:
          $ref: '#/components/schemas/GeneratedSql'
    GeneratedSql:
      type: object
      description: >-
        SQL proposed by the assistant, for review. It has not been executed; execution is a separate, explicit
        `executeQuery` call (queries only).
      required: [kind, sql, referencedTables]
      properties:
        kind:
          $ref: '#/components/schemas/SqlOutputKind'
        sql:
          type: string
          description: Empty when `kind` is `none`.
          example: SELECT c.Name, SUM(l.Quantity * l.UnitPrice) AS Revenue FROM dbo.Customers AS c JOIN dbo.Orders AS o ON o.CustomerId = c.CustomerId JOIN dbo.OrderLines AS l ON l.OrderId = o.OrderId GROUP BY c.Name
        referencedTables:
          type: array
          description: Schema-qualified tables and views the SQL uses.
          items:
            type: string
            example: dbo.Orders
        savedScriptId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: Set when `kind` is `stored-procedure`; the script was saved to the library.
    ChatTurn:
      type: object
      required: [question, answer]
      properties:
        question:
          $ref: '#/components/schemas/ChatMessage'
        answer:
          $ref: '#/components/schemas/ChatMessage'
    CreateVisualizationRequest:
      type: object
      required: [columns, intent]
      properties:
        columns:
          type: array
          minItems: 1
          description: Column definitions from the query result. Row values are never sent.
          items:
            $ref: '#/components/schemas/ColumnDefinition'
        intent:
          $ref: '#/components/schemas/VisualizationIntent'
    Visualization:
      type: object
      required: [dsl, columns]
      properties:
        dsl:
          $ref: '#/components/schemas/DslDocument'
        columns:
          type: array
          description: The columns the DSL binds to.
          items:
            $ref: '#/components/schemas/ColumnDefinition'
    ExecuteQueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          minLength: 1
          description: A single SELECT statement.
        page:
          type: integer
          minimum: 1
          default: 1
    ExecuteArtifactRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
    QueryResult:
      type: object
      description: >-
        One page of a SELECT result. `rows` are objects keyed by column name (the keys the DSL binds to). A failed
        execution is a problem response, never an empty success.
      required: [columns, rows, page, truncatedCells, durationMs]
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnDefinition'
        rows:
          type: array
          maxItems: 20
          items:
            type: object
            description: Column name to value (string, number, boolean or null). Values are data, never markup.
            additionalProperties: true
          example:
            - Name: Contoso Ltd
              Revenue: 56.5
        page:
          $ref: '#/components/schemas/PageInfo'
        truncatedCells:
          type: array
          description: Cells cut at 64 KB.
          items:
            $ref: '#/components/schemas/CellRef'
        durationMs:
          type: integer
          minimum: 0
    CellRef:
      type: object
      required: [rowIndex, column]
      properties:
        rowIndex:
          type: integer
          minimum: 0
          description: Index in `rows` of this page.
        column:
          type: string
    Script:
      type: object
      description: A generated stored-procedure script. Never created in or run against the database.
      required: [id, connectionId, name, sql, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        connectionId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: usp_RevenuePerCustomer
        sql:
          type: string
        sessionId:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: Chat session that produced it.
        createdAt:
          type: string
          format: date-time
    ArtifactStatus:
      type: string
      description: >-
        `available`; `connection-unavailable` (connection deleted or consent withdrawn);
        `migration-required` (saved with an older DSL schema version that this core cannot render yet).
      enum: [available, connection-unavailable, migration-required]
    ArtifactSummary:
      type: object
      required: [id, connectionId, name, kind, status, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        connectionId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        kind:
          type: string
          enum: [table, kpi]
        status:
          $ref: '#/components/schemas/ArtifactStatus'
        createdAt:
          type: string
          format: date-time
    Artifact:
      allOf:
        - $ref: '#/components/schemas/ArtifactSummary'
        - type: object
          required: [dsl, sql, columns]
          properties:
            dsl:
              $ref: '#/components/schemas/DslDocument'
            sql:
              type: string
              description: The SELECT the DSL is bound to.
            columns:
              type: array
              description: The columns the DSL expects; a missing column at render time is an error.
              items:
                $ref: '#/components/schemas/ColumnDefinition'
    CreateArtifactRequest:
      type: object
      required: [name, kind, dsl, sql, columns]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum: [table, kpi]
        dsl:
          $ref: '#/components/schemas/DslDocument'
        sql:
          type: string
          minLength: 1
        columns:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ColumnDefinition'
    DashboardSummary:
      type: object
      required: [id, connectionId, name, itemCount, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        connectionId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        itemCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    Dashboard:
      type: object
      required: [id, connectionId, name, items, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        connectionId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardItem'
        updatedAt:
          type: string
          format: date-time
    DashboardItem:
      type: object
      required: [id, artifactId, layout, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        artifactId:
          $ref: '#/components/schemas/Id'
        layout:
          $ref: '#/components/schemas/ItemLayout'
        status:
          type: string
          description: '`missing` when the artifact was deleted; otherwise the artifact status.'
          enum: [available, connection-unavailable, migration-required, missing]
        artifact:
          $ref: '#/components/schemas/Artifact'
    ItemLayout:
      type: object
      description: Grid position and size; stored with the dashboard, not in the DSL.
      required: [x, y, width, height]
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    DashboardNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    AddDashboardItemRequest:
      type: object
      required: [artifactId, layout]
      properties:
        artifactId:
          $ref: '#/components/schemas/Id'
        layout:
          $ref: '#/components/schemas/ItemLayout'
    SaveDashboardLayoutRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [itemId, layout]
            properties:
              itemId:
                $ref: '#/components/schemas/Id'
              layout:
                $ref: '#/components/schemas/ItemLayout'
  responses:
    ProblemResponse:
      $ref: '../common/components.yaml#/components/responses/ProblemResponse'
