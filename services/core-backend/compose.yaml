# Local dev for services/core-backend. Passwords come from ESI_CORE_PG_PASSWORD and ESI_CORE_SA_PASSWORD (shell or
# the git-ignored .env next to this file, see .env.example); without them the local-only defaults below are used.
# Database ports are published on 127.0.0.1 only (ESI_CORE_PG_PORT, ESI_CORE_SQL_PORT) for local tools and `dotnet run`.
#   docker compose up                                              -> postgres, sqlserver + esi_customer, migrations, api on :8080
#   docker compose up -d postgres customer-db-seed                 -> only the two databases (no api)
#   docker compose --profile integration run --rm integration-tests -> integration tests
#
# Two engines (ADR-0008): postgres holds esi_core, the application's own database; sqlserver holds the users' side:
# esi_customer (a sample customer database for manual testing, created once by customer-db-seed with a read-only
# login, kept across restarts) and esi_target (recreated by every integration test run). Never point the application
# database at either of them.
x-sa-password: &sa-password ${ESI_CORE_SA_PASSWORD:-EsiLocalDev_2026}
x-pg-password: &pg-password ${ESI_CORE_PG_PASSWORD:-EsiLocalDev_2026}
x-sql-image: &sql-image mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
# Local-only stand-ins (never use in a deployment): the assumed local admin user (ADR-0006: LocalAdmin starts only
# with ASPNETCORE_ENVIRONMENT=Development; deployments use ESI_CORE_Auth__Mode=Oidc) and a dummy master key for
# connection-string encryption (ADR-0003; 32 bytes, base64). Override in .env.
x-core-env: &core-env
  ASPNETCORE_ENVIRONMENT: Development
  ESI_CORE_Auth__Mode: LocalAdmin
  ESI_CORE_Encryption__ActiveKeyVersion: "1"
  ESI_CORE_Encryption__MasterKeys__1: ${ESI_CORE_MASTER_KEY_V1:-bG9jYWwtZGV2LW9ubHkta2V5LW5vdC1hLXNlY3JldCE=}

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: esi_core
      POSTGRES_USER: esi
      POSTGRES_PASSWORD: *pg-password
    ports:
      - "127.0.0.1:${ESI_CORE_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esi -d esi_core"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  sqlserver:
    # Users' side only (esi_customer, esi_target). SQL Server publishes amd64 images only; on Apple silicon Docker
    # Desktop needs Rosetta emulation.
    image: *sql-image
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *sa-password
      MSSQL_MEMORY_LIMIT_MB: ${ESI_CORE_SQL_MEMORY_LIMIT_MB:-2048}
    ports:
      - "127.0.0.1:${ESI_CORE_SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  customer-db-seed:
    # One-shot: creates esi_customer from the integration-test sample schema plus the read-only login a user enters in
    # the portal, then loads the extra demo data (scripts/customer-db-extra-data.sql) once, also into an existing
    # esi_customer. Never changes data already there; `docker compose down -v` resets it.
    image: *sql-image
    platform: linux/amd64
    entrypoint: ["bash", "/seed/seed-customer-db.sh"]
    environment:
      SA_PASSWORD: *sa-password
      CUSTOMER_DB: esi_customer
      READER_LOGIN: esi_customer_reader
      READER_PASSWORD: ${ESI_CORE_CUSTOMER_READER_PASSWORD:-EsiReader_2026}
      SCHEMA_FILE: /seed/target-sample-schema.sql
      EXTRA_DATA_FILE: /seed/customer-db-extra-data.sql
    volumes:
      - ./scripts/seed-customer-db.sh:/seed/seed-customer-db.sh:ro
      - ./tests/Esi.Core.IntegrationTests/Fixtures/target-sample-schema.sql:/seed/target-sample-schema.sql:ro
      - ./scripts/customer-db-extra-data.sql:/seed/customer-db-extra-data.sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: migrator
    image: esi-core-migrator:dev
    environment:
      ESI_CORE_AppDb__ConnectionString: &appdb-connection "Host=postgres;Database=esi_core;Username=esi;Password=${ESI_CORE_PG_PASSWORD:-EsiLocalDev_2026}"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    image: esi-core:dev
    ports:
      - "8080:8080"
    environment:
      <<: *core-env
      ESI_CORE_AppDb__ConnectionString: *appdb-connection
      ESI_CORE_Logging__LogLevel__Default: ${ESI_CORE_LOG_LEVEL:-Information}
      # services/ai-agents is another project; run it separately (its own compose, port 8000). Without it, chat
      # and visualizations answer 503 agents-unavailable.
      ESI_CORE_Agents__BaseUrl: ${ESI_CORE_AGENTS_URL:-http://host.docker.internal:8000/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

  integration-tests:
    build:
      context: .
      target: integration-test
    image: esi-core-integration-tests:dev
    profiles: [integration]
    environment:
      <<: *core-env
      ESI_CORE_TEST_APPDB: *appdb-connection
      # Server-level connection; the tests recreate esi_target from tests/Esi.Core.IntegrationTests/Fixtures/target-sample-schema.sql.
      ESI_CORE_TEST_TARGETDB: "Server=sqlserver;Database=master;User Id=sa;Password=${ESI_CORE_SA_PASSWORD:-EsiLocalDev_2026};TrustServerCertificate=True"
    depends_on:
      migrate:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy

volumes:
  postgres-data:
  sqlserver-data:
