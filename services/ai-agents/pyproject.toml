[project]
name = "esi-agents"
version = "0.0.0"
description = "ESI AI agents service: agents, tools, prompts and evals."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.143.3",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "datamodel-code-generator[black,isort]>=0.85.0",
    "httpx>=0.28",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esi_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Generated from the pinned contract by scripts/sync-published.sh; never edited or reformatted.
extend-exclude = ["src/esi_agents/contracts/agents_api.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
