openapi: 3.0.3
info:
  title: ESI agents API
  version: 0.3.0
  description: |
    HTTP API of services/ai-agents. Internal: only services/core-backend calls it; the browser never does.
    Core sends schema metadata and column definitions, never connection strings or row values (UR-1 SR-3, SR-5).
    Agents return candidates; core validates SQL (ADR-0004) and DSL (ADR-0002) and decides what reaches the user.

    **Authentication.** Service-to-service authentication is added with the authentication ADR; this version
    declares no security scheme and the service must not be exposed outside the internal network.

    **Problems** (`application/problem+json`, type `urn:esi:problem:<name>`): `invalid-request` (400),
    `model-unavailable` (503, the model provider failed or timed out).
tags:
  - name: Generation
    description: SQL and DSL generation for core-backend.
paths:
  /sql-generations:
    post:
      tags:
        - Generation
      operationId: generateSql
      summary: Generate SQL Server SQL for a question, grounded in the given schema.
      description: 'Never executes anything. Returns `kind: none` with an explanation when the schema lacks what the question needs or the request asks for writes, DDL or executing procedures. Stored procedures are returned as read-only scripts only.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlGenerationRequest'
      responses:
        '200':
          description: Generated SQL candidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlGenerationResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /dsl-generations:
    post:
      tags:
        - Generation
      operationId: generateDsl
      summary: Map result column definitions and a visualization intent to a DSL candidate.
      description: Input has column definitions only, no row values. Core validates the candidate and, on failure, calls again with `previousIssues` (at most 2 retries). Tables, KPIs and charts (`EsiChart`, ADR-0009) are generated; forms are answered with `unsupported`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DslGenerationRequest'
      responses:
        '200':
          description: DSL candidate, or `unsupported` with a reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DslGenerationResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
components:
  schemas:
    Problem:
      type: object
      description: Error body, RFC 9457 problem details (application/problem+json).
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: 'URI that identifies the problem type: `urn:esi:problem:<name>` for the documented ESI problems, or about:blank when there is nothing more specific.'
          example: urn:esi:problem:consent-withdrawn
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          description: URI that identifies this occurrence.
        traceId:
          type: string
          description: Correlation id to find the request in logs.
        errors:
          type: array
          description: Field-level validation errors.
          items:
            $ref: '#/components/schemas/FieldError'
        issues:
          type: array
          description: DSL or SQL validation findings (problem types `dsl-validation-failed` and `sql-rejected`).
          items:
            $ref: '#/components/schemas/ValidationIssue'
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Name or JSON pointer of the invalid field.
        message:
          type: string
    ValidationIssue:
      type: object
      description: One DSL or SQL validation finding.
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: unknown-bound-column
        message:
          type: string
        path:
          type: string
          description: JSON pointer into the validated document, when it applies.
          example: /components/3/text
    PageInfo:
      type: object
      description: 'Paging of a query result. Pages are numbered from 1 and hold at most `size` rows (20). Paging is stateless: every page re-runs the statement, so live data may shift between pages.'
      required:
        - number
        - size
        - remainingRows
      properties:
        number:
          type: integer
          minimum: 1
          example: 1
        size:
          type: integer
          minimum: 1
          example: 20
        remainingRows:
          type: integer
          format: int64
          minimum: 0
          description: Rows after this page.
          example: 42
    ColumnDefinition:
      type: object
      description: One column of a query result or table. Names are unique within a result.
      required:
        - name
        - sqlType
        - nullable
      properties:
        name:
          type: string
          example: CustomerName
        sqlType:
          type: string
          description: SQL Server type name with length/precision where it applies.
          example: nvarchar(200)
        nullable:
          type: boolean
    SchemaMetadata:
      type: object
      description: Schema of a SQL Server database as read by core-backend. Contains structure and stored procedure definitions as text; never row values or connection details.
      required:
        - schemas
      properties:
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseSchema'
    SqlOutputKind:
      type: string
      description: 'What generated SQL is: `query` (a single SELECT that may be executed after review), `stored-procedure` (a script the user runs themselves; never executed or created by the system), or `none` (no SQL; the explanation says why, for example missing schema information or a refused request).'
      enum:
        - query
        - stored-procedure
        - none
    VisualizationIntent:
      type: object
      description: 'What the user wants to see: a `table`, a `kpi`, or a `chart` (bar, line or pie; the agent picks the type from the columns and the wording, ADR-0009). Forms are refused with a `visualization-not-supported` problem.'
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - table
            - kpi
            - chart
          example: chart
        description:
          type: string
          maxLength: 2000
          description: The user's wording, for example "total revenue as a KPI" or "revenue per month as a line chart".
    DslDocument:
      type: object
      description: 'A UI DSL document: the A2UI `updateComponents` payload plus the metadata needed to render it later (ADR-0002). It holds column keys only, never row values. The authoritative schema and validator are the published `@dtnam0899/dsl-schema` and `@dtnam0899/dsl-core` packages; this contract only carries the document.'
      required:
        - catalogId
        - protocolVersion
        - dslSchemaVersion
        - components
      properties:
        catalogId:
          type: string
          description: 'Exact catalogId of the catalog the document uses: the pinned A2UI basic catalog (`https://a2ui.org/specification/v0_9/catalogs/basic/catalog.json`) for tables and KPIs, or the ESI catalog (`dtnam0899.github.io:esi-catalog-v0_9-1`, the basic catalog plus `EsiChart`, ADR-0009) for a document with a chart. The allowed values are defined by `@dtnam0899/dsl-schema` (0.2.0 and later).'
          example: https://a2ui.org/specification/v0_9/catalogs/basic/catalog.json
        protocolVersion:
          type: string
          example: 0.9.1
        dslSchemaVersion:
          type: string
          description: Version of `@dtnam0899/dsl-schema` the document was validated with.
          example: 0.1.0
        components:
          type: array
          minItems: 1
          description: A2UI component definitions; exactly one has the id `root`.
          items:
            type: object
            additionalProperties: true
    ConversationMessage:
      type: object
      required:
        - role
        - text
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        text:
          type: string
    SqlGenerationRequest:
      type: object
      required:
        - question
        - schema
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
          example: Total revenue per customer in 2026
        schema:
          $ref: '#/components/schemas/SchemaMetadata'
        history:
          type: array
          description: Earlier messages of the chat session, oldest first, for follow-up questions.
          items:
            $ref: '#/components/schemas/ConversationMessage'
    SqlGenerationResult:
      type: object
      required:
        - kind
        - sql
        - explanation
        - referencedTables
      properties:
        kind:
          $ref: '#/components/schemas/SqlOutputKind'
        sql:
          type: string
          description: Empty when `kind` is `none`.
        explanation:
          type: string
          description: Assumptions, tables and joins used, or why no SQL was produced.
        referencedTables:
          type: array
          items:
            type: string
            example: dbo.Orders
        procedureName:
          type: string
          description: Name of the generated procedure when `kind` is `stored-procedure`.
          example: usp_RevenuePerCustomer
    DslGenerationRequest:
      type: object
      required:
        - columns
        - intent
        - catalogId
      properties:
        columns:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ColumnDefinition'
        intent:
          $ref: '#/components/schemas/VisualizationIntent'
        catalogId:
          type: string
          description: 'The catalog the DSL must use: the basic catalog id for `table` and `kpi`, the ESI catalog id (`dtnam0899.github.io:esi-catalog-v0_9-1`, ADR-0009) for `chart`.'
          example: https://a2ui.org/specification/v0_9/catalogs/basic/catalog.json
        previousIssues:
          type: array
          description: Validation findings of the previous attempt (retry only).
          items:
            $ref: '#/components/schemas/ValidationIssue'
    DslGenerationResult:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - generated
            - unsupported
        dsl:
          $ref: '#/components/schemas/DslDocument'
        reason:
          type: string
          description: Why the request is unsupported (for example "forms are not available yet").
    ForeignKey:
      type: object
      required:
        - name
        - columns
        - referencedSchema
        - referencedTable
        - referencedColumns
      properties:
        name:
          type: string
          example: FK_Orders_Customers
        columns:
          type: array
          items:
            type: string
        referencedSchema:
          type: string
        referencedTable:
          type: string
        referencedColumns:
          type: array
          items:
            type: string
    TableMetadata:
      type: object
      required:
        - name
        - kind
        - columns
      properties:
        name:
          type: string
          example: Orders
        kind:
          type: string
          enum:
            - table
            - view
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnDefinition'
        primaryKey:
          type: array
          description: Column names of the primary key, in key order.
          items:
            type: string
        foreignKeys:
          type: array
          items:
            $ref: '#/components/schemas/ForeignKey'
    ProcedureMetadata:
      type: object
      required:
        - name
        - definition
      properties:
        name:
          type: string
          example: usp_GetCustomerOrders
        definition:
          type: string
          description: The CREATE PROCEDURE text as stored by SQL Server.
    DatabaseSchema:
      type: object
      required:
        - name
        - tables
        - procedures
      properties:
        name:
          type: string
          example: dbo
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableMetadata'
        procedures:
          type: array
          description: Existing stored procedures. Their definitions may be read as context; nothing executes them.
          items:
            $ref: '#/components/schemas/ProcedureMetadata'
  responses:
    ProblemResponse:
      description: Error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
