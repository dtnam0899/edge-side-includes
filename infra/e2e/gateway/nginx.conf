# One origin for the browser, as in a deployment: /api/* goes to core (prefix removed, like the portal's
# dev proxy in proxy.conf.json), everything else to the portal container. core has no CORS by design.
server {
  listen 8080;
  server_name _;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  location / {
    proxy_pass http://portal:8080;
    proxy_set_header Host $host;
  }
}
